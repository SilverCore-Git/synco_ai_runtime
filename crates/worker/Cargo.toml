[package]
name = "synco-ai-runtime-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file = "../../LICENSE"
description = "Worker du Synco AI Runtime : boucle d'agent durable d'une conversation (L07), dans le bac à sable du superviseur (L06)."

[lib]
name = "synco_ai_runtime_worker"
path = "src/lib.rs"

[[bin]]
name = "synco-ai-runtime-worker"
path = "src/main.rs"

[dependencies]
runtime-protocol.workspace = true
synco-e2ee.workspace = true
serde_json.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "sync", "net"] }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rsa.workspace = true
url.workspace = true
percent-encoding.workspace = true
icu_normalizer.workspace = true
icu_properties.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "time", "sync", "net"] }

[lints]
workspace = true
