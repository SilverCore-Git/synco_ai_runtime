[package]
name = "synco-ai-runtime-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file = "../../LICENSE"
description = "Worker du Synco AI Runtime (une conversation). L05 : bouchon de protocole ; L06 (bac à sable) et L07 (boucle d'agent) le remplissent."

[lib]
name = "synco_ai_runtime_worker"
path = "src/lib.rs"

[[bin]]
name = "synco-ai-runtime-worker"
path = "src/main.rs"

[dependencies]
runtime-protocol.workspace = true
synco-e2ee.workspace = true
serde_json.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "time", "sync"] }

[lints]
workspace = true
