# Vhosts nginx du Synco AI Runtime (v1 : pas de TLS natif, ce mandataire est OBLIGATOIRE).
# À adapter : noms d'hôte, chemins des certificats, adresse du runtime. Le certificat doit être
# RECONNU par les navigateurs (Let's Encrypt, CA de l'entreprise installée sur les postes et
# mobiles) : un certificat auto-signé fait échouer le WebSocket (décision D10, pas de relais API).
#
# - runtime.example.com        : WebSocket des clients + fiche publique  -> 127.0.0.1:8790
# - runtime-admin.example.com  : dashboard de l'administrateur            -> 127.0.0.1:8791
#   (à ne pas exposer sur Internet si vous pouvez l'éviter : restreindre par `allow`/`deny` ou VPN.)
#
# Côté runtime (config.toml) : listen.trust_proxy_hops = 1, dashboard.trust_proxy_hops = 1,
# dashboard.allowed_hosts = ["runtime-admin.example.com"].
#
# Le mandataire ne journalise PAS les corps de requête ; les tickets ne sont jamais dans l'URL.

# Redirection HTTP -> HTTPS (jamais de service en clair).
server {
    listen 80;
    listen [::]:80;
    server_name runtime.example.com runtime-admin.example.com;
    return 301 https://$host$request_uri;
}

# --- Endpoints publics : fiche, défi, WebSocket ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name runtime.example.com;

    ssl_certificate     /etc/letsencrypt/live/runtime.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runtime.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Seul /v1/ est relayé : tout le reste répond 404 sans atteindre le runtime.
    location /v1/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        # WebSocket (/v1/conversations/<id>/ws).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Un seul mandataire : on ÉCRASE X-Forwarded-For par l'adresse réelle du client
        # (trust_proxy_hops = 1), on n'y ajoute pas celui d'un client qui l'aurait forgé.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Flux longs : pas de mise en tampon, délais compatibles avec les échanges de maintien.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # CORS : géré par le runtime (allowed_origins) ; ne PAS ajouter d'en-tête Access-Control-*
        # ici, sous peine de doublons que le navigateur refuse.
    }
    location / { return 404; }
}

# --- Dashboard ---------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name runtime-admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/runtime-admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runtime-admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Exemple de restriction réseau (recommandé) :
    # allow 192.0.2.0/24;
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                        # contrôlé par dashboard.allowed_hosts
        proxy_set_header X-Forwarded-For $remote_addr;      # écrase, n'ajoute pas
        proxy_set_header X-Forwarded-Proto $scheme;         # cookie de session Secure
        proxy_read_timeout 60s;
    }
}
